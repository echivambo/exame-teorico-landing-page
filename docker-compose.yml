version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exameteorico_landing
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      # Escuta requisições no domínio configurado via variável ou padrão
      - "traefik.http.routers.exameteorico-landing.rule=Host(`${DOMAIN:-eteorico.automatizamoz.tech}`)"
      - "traefik.http.routers.exameteorico-landing.entrypoints=websecure"
      - "traefik.http.routers.exameteorico-landing.tls.certresolver=letsencrypt"
      - "traefik.http.services.exameteorico-landing.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"

networks:
  proxy:
    external: true

